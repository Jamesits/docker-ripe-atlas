# The package ships /usr/lib/tmpfiles.d/ripe-atlas.conf, which covers /run/ripe-atlas and
# /var/spool/ripe-atlas. /etc/ripe-atlas is created by the Debian maintainer scripts instead
# (see debian/ripe-atlas-common.preinst and debian/ripe-atlas-common.postinst in the upstream
# source), and those never run inside a container, so recreate it here with the same permissions.
#
# "C" seeds a path from /usr/share/factory when it does not exist yet (or, for a directory, when it
# is empty), leaves an existing configuration alone, and fixes ownership and mode either way. The
# per-file entries restore whatever the package shipped but the volume is missing; config.txt only
# exists in the anchor image, and an entry without a factory counterpart is silently skipped.

# "Z" takes over the recursive chown the postinst does. The mode is left alone, since the package
# only ever sets the mode of the directory itself.

#Type	Path				Mode	User		Group		Age	Argument
C	/etc/ripe-atlas			0770	ripe-atlas	ripe-atlas	-	-
C	/etc/ripe-atlas/config.txt	0644	ripe-atlas	ripe-atlas	-	-
C	/etc/ripe-atlas/mode		0644	ripe-atlas	ripe-atlas	-	-
Z	/etc/ripe-atlas			-	ripe-atlas	ripe-atlas	-
